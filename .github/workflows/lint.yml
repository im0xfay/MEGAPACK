name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check mp.py modules/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt 2>/dev/null || pip install requests
      - name: registry loads and reports
        run: |
          python3 mp.py --list
          python3 mp.py --report /tmp/report.md
          test -s /tmp/report.md
      - name: unreachable host must fail fast, not hang
        run: |
          start=$(date +%s)
          timeout 60 python3 mp.py -u http://nonexistent-xyz-12345.invalid \
              --cve CVE-2026-49049 --no-color | tee /tmp/out.txt
          end=$(date +%s)
          grep -q "host tidak terjangkau" /tmp/out.txt
          echo "elapsed: $((end-start))s"
