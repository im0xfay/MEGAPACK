name: module-contract

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: every module honours the framework contract
        run: python3 tests/test_contract.py
